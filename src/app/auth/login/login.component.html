<body>
    <div class="page-container">
        <h1>{{ "inicioSesion" | translate }}</h1>
        <div class="login-container">
            <img [src]="'usuario.png'" alt="Login">
            <form>
                <div class="form-group">
                    <label for="username">{{ "introduceUsuario" | translate }}</label>
                    <input type="text" id="username" name="username" placeholder='{{"usuario" | translate }}' required [(ngModel)]="username">
                </div>
                <div class="form-group">
                    <label for="password">{{ "introduceContrasena" | translate }}</label>
                    <input type="password" id="password" name="password" placeholder='{{"contrasena" | translate }}' required [(ngModel)]="password">
                </div>
                <button class="login-button" (click)="comprobarLogin()">Login</button>
            </form>
        </div>
    </div>
</body>
