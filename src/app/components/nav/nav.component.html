<header>
    <div class="logo">
        <img [src]="'logo.png'" alt="Logo" class="logo" routerLink="/home" />
    </div>
    <input type="text" class="search" placeholder='{{ "buscaCiudad" | translate }}'>
    <nav>
        <button routerLink="/publicarEvento">{{ "publicarEvento" | translate }}</button>

        <div class="language-switcher">
            <button class="dropdown-btn" (click)="toggleDropdown()">
                {{ "cambiarIdioma" | translate }}
            </button>
            <div class="dropdown-content" [class.show]="dropdownVisible">
                <div class="language-option" (click)="translateText('es')">
                    <img src="espanol.png" alt='{{ "español" | translate}}' class="flag" /> {{ "español" | translate }}
                </div>
                <div class="language-option" (click)="translateText('eu')">
                    <img src="euskera.png" alt='{{ "euskera" | translate}}' class="flag" /> {{ "euskera" | translate }}
                </div>
                <div class="language-option" (click)="translateText('en')">
                    <img src="ingles.png" alt='{{ "ingles" | translate}}' class="flag" /> {{ "ingles" | translate }}
                </div>
            </div>
        </div>



        <button routerLink="/login" routerLinkActive="active">{{ "inicioSesion" | translate}}</button>


    </nav>
</header>

<section class="nav">
    <nav class="menu">
        <button routerLink="/coctelerias" routerLinkActive="active">{{ "coctelerias" | translate }}</button>
        <button routerLink="/bares" routerLinkActive="active">{{ "bares" | translate }}</button>
        <button routerLink="/discotecas" routerLinkActive="active">{{ "discos" | translate }}</button>
    </nav>
</section>
