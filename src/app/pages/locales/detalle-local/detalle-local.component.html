<div id="contenedorExterior" *ngIf="local">
    <div id="imagenContenedor">
        <div id="imagenes">
            <img id="imagen" *ngIf="local?.multimedia?.images?.length" 
            [src]="local.multimedia.images[0]" alt="Imagen_Local"> 
            <br>
        </div>
    </div>
    <br>     
</div>
<hr>
<div id="body">
    <div id="textoContenedor">
        <div id="cabecera">
            <h1><b>{{ local.basicData.name }}</b></h1>
            <br>
            <div class="datos">
                <p><b>{{ local.geoData.country }} - {{ local.geoData.address }}</b></p>
            </div>
            <hr>
            <h4><b>Datos de Contacto</b></h4>
            <div class="datos">
                <p *ngIf="local.basicData.phone?.length; else noPhone">
                    {{ local.basicData.phone }}
                </p>
                <ng-template #noPhone>
                    <p>No hay un teléfono disponible</p>
                </ng-template>
            
                <p *ngIf="local.basicData.email?.length; else noMail">
                    {{ local.basicData.email }}
                </p>
                <ng-template #noMail>
                    <p>No hay un correo disponible</p>
                </ng-template>
            </div>
                <hr>
                <h4><b>Horario</b></h4>
                <div class="datos">
                <p [innerHTML]="local.extraData.schedule"></p>
           </div> 
           <hr>
        </div>
       
    </div> 
    
    <div id="descripcionContenedor" *ngIf="local">
        
        <h4><b>Descripción del Local</b></h4>
        <br>
        <div id="descripcion">
            <p  [innerHTML]="local.basicData.body"></p>
        </div>
    </div>

</div>
