<section class="section-locales">
    <div class="container">
        <div class="image-container">
            <img src="img_discoteca.jpg" alt="alt_img_discoteca" class="image main">
            <img src="img_coctel.jpg" alt="alt_img_coctel" class="image overlay">
        </div>
        <div class="text-container">
            <h2>{{"mejores" | translate}} <br> {{"locales" | translate}}</h2>
            <div class="icon">✦</div>
        </div>
    </div>

    <div class="container_list">
        <aside class="sidebar-filtros">
            <h3>{{"filtrosAvanzados" | translate}}</h3>
            <label>{{"provincia" | translate}}
                <select>
                    <option>Madrid</option>
                </select>
            </label>
            <label for="categoryFilter">{{"categoriaEvento" | translate}}</label>
            <select id="categoryFilter" [(ngModel)]="selectedCategory" (change)="filterByCategory()">
                <option value="">{{"todas" | translate}}</option>
                <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
            </select>
        </aside>

        <main class="event-list">
            <div class="event-card"
                *ngFor="let local of filteredLocals | paginate: { itemsPerPage: 5, currentPage: page}; let i = index">

                <!-- Contenedor de la imagen con botones de navegación -->
                <div class="event-image-container">
                    <button class="prev-btn" (click)="prevImage(i)" [disabled]="imageIndexes[i] === 0">❮</button>

                    <img [src]="local.multimedia.images[imageIndexes[i]]" [alt]="local.basicData.title"
                        class="event-image">

                    <button class="next-btn" (click)="nextImage(i)"
                        [disabled]="imageIndexes[i] === local.multimedia.images.length - 1">❯</button>
                </div>

                <div class="event-info">
                    <div class="titulo-btnfavorito">

                        <h2>{{ local.basicData.title }}</h2>
                        <button (click)="agregarFav(local)"
                            [ngClass]="isFavorite(local) ? 'favorite-btn' : 'not-favorite-btn'">
                            <mat-icon>favorite</mat-icon>
                        </button>

                    </div>
                    <p [innerHTML]="limitarPalabrasInfoLocal(local.basicData.body, 30)"></p>
                    <p><strong>{{"ubicacion" | translate}}:</strong> {{ local.geoData.address }}</p>
                    <!-- Categorías separadas por " - " -->
                    <p>
                        <strong>{{"categoria" | translate}}:</strong>
                        <span *ngFor="let c of local.extraData.categories; let last = last">
                            {{ c.categoria }}<span *ngIf="!last"> - </span>
                        </span>
                    </p>
                    <button class="btn-accede" (click)="selectLocal(local)">{{"accede" | translate}}</button>
                </div>
            </div>
            <div class="paginacion" *ngIf="filteredLocals.length > 5">
                <button class="btnPaginacion" mat-fab (click)="goToPreviousPage()" [disabled]="page <= 1">
                    <mat-icon>navigate_before</mat-icon>
                </button>
                <span class="pagina-actual">Página {{ page }}</span>
                <button class="btnPaginacion" mat-fab (click)="goToNextPage()"
                    [disabled]="(page * 5) >= filteredLocals.length">
                    <mat-icon>navigate_next</mat-icon>
                </button>
            </div>
        </main>
    </div>
</section>
